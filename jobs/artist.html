<body class="actor-page-view artist-page-view">
<div id="sharedHeaderRoot"></div>

<main class="artist-page-main">
    <div class="page-breadcrumb-bar">
        <div class="content-wrap">
            <nav class="page-breadcrumb" aria-label="Breadcrumb">
                <a class="page-breadcrumb-link" href="../index.html" data-i18n="artist.breadcrumbHome">Trang Chủ</a>
                <span class="page-breadcrumb-sep" aria-hidden="true">&#9656;</span>
                <span class="page-breadcrumb-current" data-i18n="artist.breadcrumbCurrent">Họa Sĩ</span>
            </nav>
        </div>
    </div>

    <div class="content-wrap artist-hero">

        <section class="artist-intro-card surface-card reveal-up">
            <div class="artist-intro-copy">
                <h1 class="artist-section-title" data-i18n="artist.sectionTitle">Thông tin cơ bản</h1>
                <p class="artist-summary" data-i18n="artist.summary">
                    Mình làm việc ở cả hai hướng 2D và 3D, tập trung vào bố cục, cảm xúc thị giác và tính ứng dụng thực tế.
                    Quy trình luôn ưu tiên việc lên ý tưởng rõ ràng, giữ chất lượng đầu ra ổn định và tối ưu để có thể tái sử dụng cho nhiều dự án khác nhau.
                </p>
            </div>
            <div class="artist-switch" role="tablist" aria-label="Chọn nhóm tác phẩm" data-i18n-attr="aria-label:artist.tabs.groupAriaLabel">
                <button class="artist-switch-btn is-active" id="artistTab2d" type="button" data-medium="2d" aria-pressed="true" data-i18n="artist.tabs.tab2d">2D</button>
                <button class="artist-switch-btn" id="artistTab3d" type="button" data-medium="3d" aria-pressed="false" data-i18n="artist.tabs.tab3d">3D</button>
            </div>
        </section>
    </div>

    <div class="content-wrap gallery-full-bleed-wrap artist-gallery-wrap reveal-up">
        <section class="artist-gallery masonry-gallery masonry-gallery--mobile-two" id="artistGallery" aria-label="Bộ sưu tập họa sĩ" data-i18n-attr="aria-label:artist.galleryAriaLabel"></section>
    </div>
</main>

<div id="sharedContactRoot"></div>
<div id="sharedBookNowRoot"></div>
<div id="sharedLightboxRoot"></div>
