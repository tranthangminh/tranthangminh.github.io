<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Kiểm Tra Giá Vốn - Harry Perfume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="common/tool-base.css">
  <link rel="stylesheet" href="cost-checker.css">
  <script src="../theme-init.js"></script>
</head>
<body>
  <div class="tool-app">
    <!-- Header -->
    <header class="tool-header">
      <div class="tool-brand">
        <span class="tool-logo-icon">🏷️</span>
        <h1 class="tool-title">Kiểm Tra Giá Vốn</h1>
      </div>

      <div class="tool-header-actions">
        <div class="db-status-badge" id="dbStatusBadge" title="Trạng thái kho dữ liệu">
          <span class="status-dot"></span>
          <span id="dbCountText">Đang tải kho...</span>
        </div>
        <button type="button" class="btn-topbar" id="btnToggleTheme" title="Chuyển đổi giao diện Sáng / Tối">
          <span id="themeIcon" class="icon-mask tool-icon"></span>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <section class="tool-toolbar">
      <div class="toolbar-left">
        <div class="row-summary" id="rowSummary"></div>
      </div>
      <div class="toolbar-right">
        <select id="filterSelect" class="toolbar-select" title="Lọc dòng hiển thị">
          <option value="all">Tất Cả</option>
          <option value="ok">Đã Đúng</option>
          <option value="review">Cần Xem Xét</option>
          <option value="fix">Cần Sửa</option>
        </select>
        <button type="button" class="btn-action btn-toolbar-icon" id="btnTogglePreview" title="Ảnh lớn: Bật (bấm để tắt)" aria-label="Ảnh lớn"><span class="icon-mask tool-icon" style="mask-image:url('../svg/images.svg');-webkit-mask-image:url('../svg/images.svg')"></span></button>
        <button type="button" class="btn-action btn-clear btn-toolbar-icon" id="btnClearAll" title="Xóa trắng toàn bộ nội dung" aria-label="Xóa trắng"><span class="icon-mask tool-icon" style="mask-image:url('../svg/delete.svg');-webkit-mask-image:url('../svg/delete.svg')"></span></button>
      </div>
    </section>

    <!-- Bảng Excel với thanh cuộn chung -->
    <main class="spreadsheet-container" id="spreadsheetContainer">
      <table class="excel-table" id="excelTable">
        <thead>
          <tr>
            <th class="th-num">#</th>
            <th class="th-thumb">Hình</th>
            <!-- Tiêu đề 2 dòng khớp ô 2 hàng: trên Input Name (Dán, Xóa cột), dưới Output Name (Copy) -->
            <th class="th-name">
              <div class="th-stack">
                <div class="th-line th-line-input">
                  <span class="th-title">Input Name</span>
                  <div class="th-actions">
                    <button type="button" class="btn-th-action" id="btnPasteCol2" title="Dán danh sách tên vào cột Input Name">Dán</button>
                    <button type="button" class="btn-th-action btn-th-clear btn-icon-square" id="btnClearCol2" title="Xóa cột Input Name" aria-label="Xóa cột"><span class="icon-mask tool-icon" style="mask-image:url('../svg/close.svg');-webkit-mask-image:url('../svg/close.svg')"></span></button>
                  </div>
                </div>
                <div class="th-line th-line-output">
                  <span class="th-title">Output Name</span>
                  <button type="button" class="btn-th-action btn-icon-square" id="btnCopyCol1" title="Copy toàn bộ cột Output Name để dán vào Google Sheet" aria-label="Copy"><span class="icon-mask tool-icon" style="mask-image:url('../svg/copy.svg');-webkit-mask-image:url('../svg/copy.svg')"></span></button>
                </div>
              </div>
            </th>
            <!-- Tiêu đề 2 dòng khớp ô 2 hàng: trên Input Vốn (Dán, Xóa cột), dưới Output Vốn (Copy) -->
            <th class="th-cost">
              <div class="th-stack">
                <div class="th-line th-line-input">
                  <span class="th-title">Input Vốn</span>
                  <div class="th-actions">
                    <button type="button" class="btn-th-action" id="btnPasteCol3" title="Dán giá vào cột Input Vốn">Dán</button>
                    <button type="button" class="btn-th-action btn-th-clear btn-icon-square" id="btnClearCol3" title="Xóa cột Input Vốn" aria-label="Xóa cột"><span class="icon-mask tool-icon" style="mask-image:url('../svg/close.svg');-webkit-mask-image:url('../svg/close.svg')"></span></button>
                  </div>
                </div>
                <div class="th-line th-line-output">
                  <span class="th-title">Output Vốn</span>
                  <button type="button" class="btn-th-action btn-icon-square" id="btnCopyCol4" title="Copy toàn bộ cột Output Vốn để dán vào Google Sheet" aria-label="Copy"><span class="icon-mask tool-icon" style="mask-image:url('../svg/copy.svg');-webkit-mask-image:url('../svg/copy.svg')"></span></button>
                </div>
              </div>
            </th>
            <th class="th-merge">
              <span class="th-title">Merge Vốn</span>
              <button type="button" class="btn-th-action btn-icon-square" id="btnCopyMerge" title="Copy toàn bộ cột Merge Vốn để dán vào Google Sheet" aria-label="Copy"><span class="icon-mask tool-icon" style="mask-image:url('../svg/copy.svg');-webkit-mask-image:url('../svg/copy.svg')"></span></button>
            </th>
          </tr>
        </thead>
        <tbody id="excelTableBody"></tbody>
      </table>
    </main>

    <div id="toolToast" class="tool-toast" style="display: none;">
      <span id="toolToastMsg"></span>
    </div>

    <!-- Ảnh lớn 128x128 khi hover dòng -->
    <div id="cursorImagePreview" class="cursor-image-preview" style="display: none;">
      <img id="cursorImageTag" alt="">
    </div>
  </div>

  <script src="../common/formatters.js"></script>
  <script src="../storage-helper.js"></script>
  <script src="../common/api-config.js"></script>
  <script src="../common/product-search.js"></script>
  <script src="common/tool-shell.js"></script>
  <script src="cost-checker-parser.js"></script>
  <script src="cost-checker.js"></script>
</body>
</html>
