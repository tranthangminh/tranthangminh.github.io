<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>(M) Kiểm Tra Dung Tích - Harry Perfume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="common/tool-base.css">
  <link rel="stylesheet" href="volume-checker.css">
  <script src="../theme-init.js"></script>
</head>
<body>
  <div class="tool-app">
    <!-- Header -->
    <header class="tool-header">
      <div class="tool-brand">
        <span class="tool-logo-icon">📏</span>
        <h1 class="tool-title">(M) Kiểm Tra Dung Tích</h1>
      </div>
      <div class="tool-header-actions">
        <div class="db-status-badge" id="dbStatusBadge" title="Tên chuẩn và dungtich1..5 lấy từ tab Nước Hoa">
          <span class="status-dot"></span>
          <span id="dbCountText">Đang nạp dữ liệu...</span>
        </div>
        <button type="button" class="btn-topbar" id="btnToggleTheme" title="Chuyển đổi giao diện Sáng / Tối">
          <span id="themeIcon" class="icon-mask tool-icon"></span>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <section class="tool-toolbar">
      <div class="toolbar-left">
        <div class="row-summary" id="rowSummary"></div>
        <span class="vc-skip-note" id="skipNote"></span>
      </div>
      <div class="toolbar-right">
        <select id="filterSelect" class="toolbar-select" title="Lọc dòng hiển thị">
          <option value="all">Tất Cả</option>
          <option value="ok">Đã Đúng</option>
          <option value="review">Cần Xem Xét</option>
          <option value="fix">Cần Sửa</option>
        </select>
        <button type="button" class="btn-action" id="btnPaste" title="Dán danh sách tên sản phẩm (Thương hiệu - Tên - Dung tích), thay toàn bộ dữ liệu cũ. Cũng có thể bấm Ctrl + V">Dán</button>
        <button type="button" class="btn-action btn-toolbar-icon" id="btnTogglePreview" title="Ảnh lớn: Bật (bấm để tắt)" aria-label="Ảnh lớn"><span class="icon-mask tool-icon" style="mask-image:url('../svg/images.svg');-webkit-mask-image:url('../svg/images.svg')"></span></button>
        <button type="button" class="btn-action btn-clear btn-toolbar-icon" id="btnClearAll" title="Xóa trắng toàn bộ nội dung - bấm 2 lần" aria-label="Xóa trắng"><span class="icon-mask tool-icon" style="mask-image:url('../svg/delete.svg');-webkit-mask-image:url('../svg/delete.svg')"></span></button>
      </div>
    </section>

    <!-- Bảng chỉ xem: mỗi ô 2 hàng - trên: tên chuẩn / dungtich1..5 tab Nước Hoa, dưới: dữ liệu dán vào -->
    <main class="spreadsheet-container" id="spreadsheetContainer">
      <table class="excel-table">
        <thead>
          <tr>
            <th class="th-num">#</th>
            <th class="th-thumb">Hình</th>
            <th class="th-name">
              <div class="th-stack">
                <div class="th-line th-line-input">Tên chuẩn</div>
                <div class="th-line th-line-output">Tên nhập</div>
              </div>
            </th>
            <th class="th-vol">DT1</th>
            <th class="th-vol">DT2</th>
            <th class="th-vol">DT3</th>
            <th class="th-vol">DT4</th>
            <th class="th-vol">DT5</th>
          </tr>
        </thead>
        <tbody id="rowsTableBody"></tbody>
      </table>
    </main>

    <div id="toolToast" class="tool-toast" style="display: none;">
      <span id="toolToastMsg"></span>
    </div>

    <!-- Ảnh lớn 128x128 khi rê chuột vào dòng -->
    <div id="cursorImagePreview" class="cursor-image-preview" style="display: none;">
      <img id="cursorImageTag" alt="">
    </div>
  </div>

  <script src="../common/formatters.js"></script>
  <script src="../storage-helper.js"></script>
  <script src="../common/api-config.js"></script>
  <script src="common/tool-shell.js"></script>
  <script src="volume-checker-parser.js"></script>
  <script src="volume-checker.js"></script>
</body>
</html>
