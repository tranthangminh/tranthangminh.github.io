<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241416"/>
      <stop offset="50%" stop-color="#181316"/>
      <stop offset="100%" stop-color="#121114"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  <!-- Globe / Network Wireframe -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4a2228" stroke-width="12"/>
  <ellipse cx="256" cy="256" rx="64" ry="140" fill="none" stroke="#4a2228" stroke-width="10"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="#4a2228" stroke-width="10"/>
  <line x1="150" y1="180" x2="362" y2="180" stroke="#4a2228" stroke-width="8"/>
  <line x1="150" y1="332" x2="362" y2="332" stroke="#4a2228" stroke-width="8"/>
  <!-- Shield / Block Overlay with Glow -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="110" fill="none" stroke="url(#redGrad)" stroke-width="24"/>
    <line x1="178" y1="178" x2="334" y2="334" stroke="url(#redGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>
  <!-- Center Accent / Dot -->
  <circle cx="256" cy="256" r="28" fill="#ff4d4d"/>
</svg>
