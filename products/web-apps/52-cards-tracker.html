<body>
    <!-- Top App Header -->
    <header class="app-header">
        <div class="header-brand">
            <div class="brand-icon" aria-hidden="true">🃏</div>
            <h1 class="brand-title" data-i18n="brand.title">52 Cards Tracker</h1>
        </div>

        <!-- Header Actions: Right-to-Left (SSO -> Lang -> Sound) -->
        <div class="header-actions">
            <!-- Sound Toggle Button -->
            <button type="button" class="icon-btn" id="soundToggleBtn" aria-label="Toggle Sound">🔊</button>

            <!-- Bilingual Switcher (Sticky Header Pure CSS Flag Style) -->
            <div class="lang-switch">
                <button type="button" class="lang-btn lang-btn--toggle" id="langToggleBtn" data-lang="en" aria-label="Chuyển sang Tiếng Anh">
                    <span class="lang-flag lang-flag--en" aria-hidden="true"></span>
                    <span class="lang-code">EN</span>
                </button>
            </div>

            <!-- Shared SSO Auth Slot -->
            <div id="sharedAuthSlot"></div>
        </div>
    </header>

    <!-- Main Container (Original Layout) -->
    <div class="app">
        <!-- Top Bar: Game Select & Counter -->
        <div class="top-bar">
            <select id="gameSelect">
                <option value="tienlen" selected data-i18n="gameModes.tienlen">Tiến Lên</option>
                <option value="blackjack" data-i18n="gameModes.blackjack">Blackjack</option>
                <option value="poker" data-i18n="gameModes.poker">Poker</option>
            </select>
            <div class="counter" id="counter">0 / 52🃏</div>
        </div>

        <!-- 52 Cards Grid (13 Columns - Text Size Preserved at 45px / 20px) -->
        <div class="cards" id="cards"></div>

        <!-- History Panel -->
        <div class="history-panel">
            <div class="history-title" data-i18n="history.title">History</div>
            <div id="history"></div>
        </div>

        <!-- Tiến Lên Panel (Heo Radar, Tứ Quý Alert & 13 Cards Hand) -->
        <div class="game-panel" id="tienlen-panel">
            <div class="panel-header">
                <div class="panel-title" data-i18n="tienlen.title">Tiến Lên Hand (13 cards)</div>
            </div>

            <!-- Radar 4 Con Heo -->
            <div class="heo-radar" id="heoRadar"></div>

            <!-- Tứ Quý Alert Banner -->
            <div class="tuquy-alert is-safe" id="tuQuyAlert" data-i18n="tienlen.tuQuySafe">
                ✅ An toàn: Không còn bộ Tứ Quý nguyên vẹn
            </div>

            <!-- 13 Hand Slots -->
            <div id="tienlen-hand">
                <div class="hand-card"><span class="hand-slot-num">1</span></div>
                <div class="hand-card"><span class="hand-slot-num">2</span></div>
                <div class="hand-card"><span class="hand-slot-num">3</span></div>
                <div class="hand-card"><span class="hand-slot-num">4</span></div>
                <div class="hand-card"><span class="hand-slot-num">5</span></div>
                <div class="hand-card"><span class="hand-slot-num">6</span></div>
                <div class="hand-card"><span class="hand-slot-num">7</span></div>
                <div class="hand-card"><span class="hand-slot-num">8</span></div>
                <div class="hand-card"><span class="hand-slot-num">9</span></div>
                <div class="hand-card"><span class="hand-slot-num">10</span></div>
                <div class="hand-card"><span class="hand-slot-num">11</span></div>
                <div class="hand-card"><span class="hand-slot-num">12</span></div>
                <div class="hand-card"><span class="hand-slot-num">13</span></div>
            </div>

            <!-- Tiến Lên Action Buttons -->
            <div class="tienlen-controls">
                <button type="button" id="addModeBtn" data-i18n="tienlen.addModeBtn">
                    <span aria-hidden="true">🃏</span>
                    <span data-i18n="tienlen.addModeBtn">Add Mode</span>
                </button>
                <button type="button" id="sortTienLenBtn">
                    <span aria-hidden="true">📶</span>
                    <span data-i18n="tienlen.sortBtn">Sort Hand</span>
                </button>
            </div>
        </div>

        <!-- Blackjack Panel (5 Cards Hand & Soft Ace Odds) -->
        <div class="game-panel" id="blackjack-panel" style="display:none;">
            <div class="panel-header">
                <div class="panel-title" data-i18n="blackjack.title">Blackjack Hand (5 cards)</div>
                <button type="button" class="panel-action-btn" id="newBlackjackHandBtn">
                    <span aria-hidden="true">🔄</span>
                    <span data-i18n="blackjack.newHandBtn">Ván Mới</span>
                </button>
            </div>

            <div id="blackjack-hand">
                <div class="hand-card"><span class="hand-slot-num">1</span></div>
                <div class="hand-card"><span class="hand-slot-num">2</span></div>
                <div class="hand-card"><span class="hand-slot-num">3</span></div>
                <div class="hand-card"><span class="hand-slot-num">4</span></div>
                <div class="hand-card"><span class="hand-slot-num">5</span></div>
            </div>

            <div id="blackjack-info">
                <div id="blackjack-total">Total: 0</div>
                <div id="blackjack-chance">
                    <div class="chance-pill chance-neutral">Safe (≤21): --%</div>
                    <div class="chance-pill chance-neutral">Bust (>21): --%</div>
                </div>
            </div>
        </div>

        <!-- Texas Hold'em Poker Panel (Hole & Community Cards Outs) -->
        <div class="game-panel" id="poker-panel" style="display:none;">
            <div class="panel-header">
                <div class="panel-title" data-i18n="poker.title">Poker Texas Hold'em</div>
                <button type="button" class="panel-action-btn" id="newPokerHandBtn">
                    <span aria-hidden="true">🔄</span>
                    <span data-i18n="poker.newHandBtn">Ván Mới</span>
                </button>
            </div>

            <div class="poker-sections">
                <!-- Hole Cards (2) -->
                <div>
                    <div class="poker-group-title" data-i18n="poker.holeTitle">Bài Tẩy (2 lá)</div>
                    <div id="poker-hole">
                        <div class="hand-card"><span class="hand-slot-num">H1</span></div>
                        <div class="hand-card"><span class="hand-slot-num">H2</span></div>
                    </div>
                </div>

                <!-- Community Cards (5) -->
                <div>
                    <div class="poker-group-title" data-i18n="poker.communityTitle">Bài Chung (5 lá)</div>
                    <div id="poker-community">
                        <div class="hand-card"><span class="hand-slot-num">Flop 1</span></div>
                        <div class="hand-card"><span class="hand-slot-num">Flop 2</span></div>
                        <div class="hand-card"><span class="hand-slot-num">Flop 3</span></div>
                        <div class="hand-card"><span class="hand-slot-num">Turn</span></div>
                        <div class="hand-card"><span class="hand-slot-num">River</span></div>
                    </div>
                </div>
            </div>

            <!-- Poker Outs & Unseen Info -->
            <div id="poker-info"></div>
        </div>

        <!-- Fixed Bottom Controls -->
        <div class="bottom-controls">
            <div class="bottom-controls-inner">
                <button type="button" class="control hide" id="hideBtn">
                    <span aria-hidden="true">🙈</span>
                    <span data-i18n="controls.hideAll">Hide</span>
                </button>
                <button type="button" class="control show" id="showBtn">
                    <span aria-hidden="true">👁️</span>
                    <span data-i18n="controls.showAll">Show</span>
                </button>
                <button type="button" class="control undo" id="undoBtn">
                    <span aria-hidden="true">↩️</span>
                    <span data-i18n="controls.undo">Undo</span>
                </button>
                <button type="button" class="control redo" id="redoBtn">
                    <span aria-hidden="true">↪️</span>
                    <span data-i18n="controls.redo">Redo</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script src="./52-cards-tracker/52-cards-tracker-i18n.js?v=20261026-2"></script>
    <script src="./52-cards-tracker/audio.js?v=20261026-2"></script>
    <script src="./52-cards-tracker/deck.js?v=20261026-2"></script>
    <script src="./52-cards-tracker/history.js?v=20261026-2"></script>
    <script src="./52-cards-tracker/game-modes.js?v=20261026-2"></script>
    <script src="./52-cards-tracker/app.js?v=20261026-2"></script>

    <!-- Shared Web App Visit Counter -->
    <script src="../../common/shared-webapp-counter.js?v=20261026-2" data-webapp-id="webapp-52cardstracker"></script>
</body>
